[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmus"
version = "0.1.0"
description = "Multimodal urban knowledge-graph construction and integration"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["kg_construction*", "llm*", "utilities*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]
