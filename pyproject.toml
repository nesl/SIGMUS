[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmus"
version = "0.1.0"
description = "Storage and question answering for enriched urban observations"
requires-python = ">=3.10"
dependencies = [
    "urban-observations>=0.1,<1",
]

[project.scripts]
sigmus-mcp = "qa.mcp_server:main"
sigmus-ask = "qa.client:main"
sigmus-ingest = "database_storage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["database_storage*", "qa*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]
